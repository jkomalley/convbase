[project]
name = "convbase"
version = "1.0.0"
description = 'Base conversion command line utility.'
readme = "README.md"
requires-python = ">=3.10"
keywords = []
authors = [{ name = "Kyle O'Malley", email = "j.kyle.omalley@gmail.com" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Utilities",
]
dependencies = ["click>=8.0"]

[project.urls]
Documentation = "https://github.com/jkomalley/convbase#readme"
Issues = "https://github.com/jkomalley/convbase/issues"
Source = "https://github.com/jkomalley/convbase"

[project.scripts]
bin = "convbase.cli:bin_cmd"
oct = "convbase.cli:oct_cmd"
dec = "convbase.cli:dec_cmd"
hex = "convbase.cli:hex_cmd"


[tool.pytest.ini_options]
addopts = "--cov=convbase --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.ruff]
fix = true

[tool.ruff.format]
line-ending = "lf"
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["A001"]

[build-system]
requires = ["uv_build>=0.9.25,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.0.2", "pytest-cov>=5.0.0", "ruff>=0.5.5", "ty>=0.0.11"]
