[project]
name = "convbase"
version = "1.0.0"
description = 'Base conversion command line utility.'
readme = "README.md"
requires-python = ">=3.10"
keywords = []
authors = [{ name = "Kyle O'Malley", email = "j.kyle.omalley@gmail.com" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Utilities",
]
dependencies = ["click>=8.0"]

[project.urls]
Documentation = "https://github.com/jkomalley/convbase#readme"
Issues = "https://github.com/jkomalley/convbase/issues"
Source = "https://github.com/jkomalley/convbase"

[project.scripts]
bin = "convbase.cli:bin_cmd"
oct = "convbase.cli:oct_cmd"
dec = "convbase.cli:dec_cmd"
hex = "convbase.cli:hex_cmd"


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=convbase --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # --- Formatting / style clashes ---
    "D203",   # one-blank-line-before-class (conflicts with D211)
    "D213",   # multi-line-summary-second-line (conflicts with D212)
    "D100",   # missing docstring in public module
    "D104",   # missing docstring in public package
    "D107",   # missing docstring in __init__ method

    # --- Overly pedantic / noisy ---
    "COM812", # missing trailing comma (conflicts with formatter)
    "ISC001", # single-line implicit string concatenation (conflicts with formatter)
    "FIX002", # line contains TODO
    "TD002",  # missing author in TODO
    "TD003",  # missing issue link in TODO
    "ERA001", # found commented-out code
    "TRY003", # avoid specifying long messages outside the exception class
    "EM101",  # exception must not use a string literal
    "EM102",  # exception must not use an f-string literal

    # --- Pragmatic ignores ---
    "S101",   # use of assert (needed in tests, fine in internal code)
    "PLR2004",# magic value used in comparison
    "CPY001", # missing copyright notice
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "D",      # no docstring requirements in tests
    "ANN",    # no type annotation requirements in tests
    "SLF001", # allow access to private members in tests
    "INP001", # tests/ is a pytest rootdir-based test suite, not an importable package
]

[build-system]
requires = ["uv_build>=0.9.25,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.10",
    "ty>=0.0.37",
]
